<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Fast</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:#111b21;color:#d1d7db;display:flex;align-items:center;justify-content:center}
    .splash{text-align:center}
    .spinner{width:42px;height:42px;border:4px solid rgba(209,215,219,.2);border-top-color:#25d366;border-radius:50%;margin:0 auto 18px;animation:spin 0.9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    p{opacity:.8;margin:0}
  </style>
</head>
<body>
  <div class="splash">
    <div class="spinner"></div>
    <p>Loading WhatsApp Fast…</p>
  </div>
</body>
</html>
